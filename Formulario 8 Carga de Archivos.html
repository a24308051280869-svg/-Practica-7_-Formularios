<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario con Archivos</title>
</head>
<body>
    <!-- Comentario: Campo de tipo file para seleccionar y adjuntar archivos locales -->
    <h2>Formulario con archivos</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        <input type="file" name="archivo">
        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>
</body>
</html>
