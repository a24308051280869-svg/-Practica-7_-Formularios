<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario con Limitaciones</title>
</head>
<body>
    <!-- Comentario: Demostración de restricciones como disabled, maxlength y readonly -->
    <h2>Formulario con limitaciones</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <!-- Deshabilitación de campo -->
        <input type="text" name="nombre" disabled><br>
        <!-- Limitación de caracteres -->
        Contraseña:
        <input type="password" name="pass" maxlength="5"><br>
        <!-- Solo lectura -->
        Comentarios:
        <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br>
    </form>
</body>
</html>
