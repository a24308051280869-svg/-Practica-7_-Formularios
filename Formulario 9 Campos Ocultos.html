<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario con Campos Ocultos</title>
</head>
<body>
    <!-- Comentario: Campo oculto (type="hidden") que envía información al servidor sin ser visible -->
    <h2>Formulario con campos ocultos</h2>
    <form action="" method="post">
        <input type="hidden" name="hora" value="3:30">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>
</body>
</html>
