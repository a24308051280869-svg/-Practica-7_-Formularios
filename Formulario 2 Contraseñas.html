<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Contraseñas</title>
</head>
<body>
    <!-- Comentario: Formulario que incluye un campo de contraseña de entrada oculta (password) y botón de reinicio -->
    <h2>Formulario para contraseñas</h2>
    <form action="" method="post">
        Ingresa tu usuario:
        <input type="text" name="usuario">
        <br>
        Ingresa tu contraseña:
        <input type="password" name="pass">
        <br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
</body>
</html>
