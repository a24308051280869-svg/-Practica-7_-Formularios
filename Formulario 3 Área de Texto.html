<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario con Text Area</title>
</head>
<body>
    <!-- Comentario: Utiliza un elemento textarea para permitir comentarios largos o multilínea -->
    <h2>Formulario con text area</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        Ingresa tu correo:
        <input type="email" name="correo">
        <br>
        Ingresa tus comentarios:
        <textarea name="comentarios" rows="1" cols="10"></textarea>
        <br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
</body>
</html>
